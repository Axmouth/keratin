<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Batch timeline</title>
<style>
:root { color-scheme: light dark; --background:light-dark(#fff,#151619); --foreground:light-dark(#20242b,#e4e7ee); --border:light-dark(#d3d8df,#454b55); --popover:var(--background); --popover-foreground:var(--foreground); --viz-series-1:light-dark(#2677b9,#71b7ec); --viz-series-2:light-dark(#b87716,#efb957); --viz-series-3:light-dark(#4a916c,#71bb8d); --viz-series-4:light-dark(#9965b2,#c993e1); --viz-series-5:light-dark(#b65367,#e695a8); --viz-series-6:light-dark(#428e98,#8bcbd4); }
body { background:var(--background); color:var(--foreground); font:14px/1.5 system-ui,sans-serif; max-width:1000px; margin:auto; padding:20px; }
h3 { font-size:18px; font-weight:500; }
.viz-controls { display:flex; flex-wrap:wrap; gap:12px; }
.form-label { display:flex; flex-direction:column; gap:4px; max-width:100%; }
.form-select { font:inherit; color:inherit; background:var(--background); border:1px solid var(--border); padding:8px; border-radius:4px; max-width:100%; }
.text-small { font-size:12px; }
.tabular-nums { font-variant-numeric:tabular-nums; }
.tooltip { padding:10px; border:1px solid var(--border); border-radius:4px; }
[data-scope], [data-detail] { margin-top:10px; }
</style>
</head>
<body>
__FRAGMENT__
</body>
</html>
