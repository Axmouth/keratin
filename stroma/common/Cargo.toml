[package]
name = "stroma-common"
version = "0.1.0"
edition = "2024"

# Dependency-light home for the value types that originate at the stroma/storage
# layer and are shared upward (Partition, Offset, Topic, Group). Kept free of the
# engine machinery so consumers — including network clients several layers up —
# can use these types without pulling in the full engine.
[dependencies]
serde = { version = "1.0", features = ["derive"] }

[package.metadata.sovereignty]
ai-training = "prohibited"
