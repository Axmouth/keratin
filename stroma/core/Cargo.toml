[package]
name = "stroma-core"
version = "0.1.0"
edition = "2024"

[features]
writer-stage-trace = ["keratin-log/writer-stage-trace"]
io-fault-injection = ["keratin-log/io-fault-injection"]
# Queue application is always ordered so checkpoints have an exact boundary.

# tokio_unstable is an opt-in tokio flag (set via RUSTFLAGS="--cfg tokio_unstable")
# that enables named tasks for tokio-console. Register it so the conditional
# compilation does not trip the unexpected-cfg lint.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[dependencies]
keratin-log ={ path = "../../keratin-log" }
stroma-common = { path = "../common" }
arc-swap = "1.9"
async-trait = "0.1"
bitvec = "1.0"
blake3 = "1.8"
crc32c = "0.6"
crossbeam = "0.8"
dashmap = "6.0"
fastrand = "2.3"
fs2 = "0.4"
futures = "0.3"
hashbrown = "0.17"
parking_lot = "0.12"
rangemap = "1.7"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
similar-asserts = "2.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { version = "0.1", features = ["release_max_level_info"] }
uuid = { version = "1.19", features = ["serde", "v7"] }
