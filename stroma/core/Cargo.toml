[package]
name = "stroma-core"
version = "0.1.0"
edition = "2024"

[dependencies]
keratin-log ={ path = "../../keratin-log" }
arc-swap = "1.9"
async-trait = "0.1"
bitvec = "1.0"
blake3 = "1.8"
crc32c = "0.6"
crossbeam = "0.8"
dashmap = "6.0"
fastrand = "2.3"
futures = "0.3"
hashbrown = "0.17"
parking_lot = "0.12"
rangemap = "1.7"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
similar-asserts = "2.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { version = "0.1", features = ["release_max_level_info"] }
uuid = { version = "1.19", features = ["serde", "v7"] }
