[package]
name = "keratin-log"
version = "0.1.0"
edition = "2024"

[features]
# Test-only file-operation faults. Never enable in deployed binaries.
io-fault-injection = []
early-replication-experiment = []
default = []
writer-stage-trace = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
byteorder = "1.5"
crc32c = "0.6"
crossbeam-channel = "0.5"
dashmap = "6.1"
fastrand = "2.3"
futures = "0.3"
fs2 = "0.4"
parking_lot = "0.12"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = [
    "fmt",
    "env-filter",
    "json",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["fs"] }

[package.metadata.ai]
training = "prohibited"
