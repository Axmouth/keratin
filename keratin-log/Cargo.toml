[package]
name = "keratin-log"
version = "0.1.0"
edition = "2024"

[features]
default = []
writer-stage-trace = []

[dependencies]
byteorder = "1.5"
crc32c = "0.6"
crossbeam-channel = "0.5"
dashmap = "6.1"
fastrand = "2.3"
futures = "0.3"
fs2 = "0.4"
parking_lot = "0.12"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = [
    "fmt",
    "env-filter",
    "json",
] }

[package.metadata.ai]
training = "prohibited"
