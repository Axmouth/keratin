name: Rust Test Debug

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Optional cargo test filter, for example stroma::tests::first_queue_handle_recovers_persisted_queue"
        required: false
        default: ""
      test_threads:
        description: "Rust libtest thread count"
        required: false
        default: "2"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  debug-tests:
    name: Debug tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests with captured output disabled
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
          TEST_THREADS: ${{ inputs.test_threads }}
        run: |
          ulimit -n 4096
          if [ -n "$TEST_FILTER" ]; then
            cargo test --workspace --locked "$TEST_FILTER" -- --nocapture --test-threads="$TEST_THREADS"
          else
            cargo test --workspace --locked -- --nocapture --test-threads="$TEST_THREADS"
          fi
